<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Why So Serious - Final Black Background</title>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000 !important; 
            overflow: hidden;
        }

        #player, ruffle-player {
            width: 100%;
            height: 100%;
            display: block;
            background-color: #000;
        }
    </style>
</head>

<body>
    <div id="player"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        const ruffle = window.RufflePlayer.newest();
        
        const container = document.getElementById("player");

        const player = ruffle.createPlayer(container, {
            bgcolor: "#000000", 
            
            wmode: "opaque",
            
            scale: "exactfit",
        });

        player.load("TDK121_5.swf");
    </script>
</body>
</html>
