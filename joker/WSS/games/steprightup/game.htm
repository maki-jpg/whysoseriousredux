<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Why So Serious</title>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style type="text/css">
        @import "game.css";
    </style>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            text-align: center;
        }

        /* ONLY style the container, NOT ruffle-player */
        #player {
            display: inline-block;
            background: #000;
        }
    </style>
</head>

<body>
    <div id="player"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();

        // Safe to set width/height here
        player.style.width = "1227px";
        player.style.height = "852px";

        document.getElementById("player").appendChild(player);
        player.load("TDK121_5.swf");
    </script>
</body>
</html>
