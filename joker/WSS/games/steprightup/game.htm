<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Why So Serious</title>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #player-container {
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        ruffle-player, canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }
    </style>
</head>

<body>
    <div id="player-container"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            quality: "high",
            scale: "showAll",       // proper proportional scaling
            letterbox: "on",        // black bars as needed
            autoplay: "on"
        };

        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();

        document.getElementById("player-container").appendChild(player);
        player.load("TDK121_5.swf");
    </script>
</body>
</html>
