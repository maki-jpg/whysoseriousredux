<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Why So Serious</title>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #scale-box {
            transform: scale(2.5);
            transform-origin: top left;
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <div id="scale-box">
            <div id="player"></div>
        </div>
    </div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            scale: "none",
            letterbox: "on"
        };

        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();

        document.getElementById("player").appendChild(player);
        player.load("TDK121_5.swf");
    </script>
</body>
</html>
