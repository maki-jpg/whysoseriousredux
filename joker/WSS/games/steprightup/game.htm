<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Why So Serious</title>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style type="text/css">
        @import "game.css";
    </style>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000 !important; 
            overflow: hidden;
        }

        #player, ruffle-player {
            width: 100%;
            height: 100%;
            display: block;
            background-color: #000;
        }
    </style>
</head>

<body>
    <div id="player"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        const ruffle = window.RufflePlayer.newest();
        
    
        const player = ruffle.createPlayer(document.getElementById("player"), {
     
            bgcolor: "#000000", 
            
            scale: "exactfit",
           
        });

        player.load("TDK121_5.swf");
    </script>
</body>
</html>
